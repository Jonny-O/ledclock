# ledclock preferences
#
# Every key here is optional — anything you delete falls back to the built-in
# default in ledclock/config.py.  Restart the service after editing:
#     sudo systemctl restart ledclock

[matrix]
rows = 64
cols = 128
chain_length = 1
parallel = 1

# 'regular'          HUB75 ribbon jumpered straight to the Pi header (this build)
# 'adafruit-hat'     Adafruit RGB Matrix HAT / Bonnet
# 'adafruit-hat-pwm' ...with the GPIO4->GPIO18 jumper soldered
hardware_mapping = "regular"

brightness = 60

# Pi 4 usually needs 3-5.  Raise it if the panel shows sparkle or ghosting,
# lower it if the refresh rate is too low and the image flickers.
gpio_slowdown = 4

pwm_bits = 11
pwm_lsb_nanoseconds = 130

# Leave 0 unless your panel needs them (some P2 panels want row_address_type=0
# and multiplexing=0, which is the common case for 128x64 1/32-scan).
scan_mode = 0
row_address_type = 0
multiplexing = 0
pixel_mapper = ""

# Set true only if you could not disable onboard audio; costs image quality.
disable_hardware_pulsing = false

# If the panel stays completely dark but the Pi is clearly driving it, try
# panel_type = "FM6126A" — a common driver chip on 128x64 P2 panels that needs
# an init sequence. Leave "" otherwise.
panel_type = ""

# Swap if your panel's colours are wrong, e.g. "RBG".
led_rgb_sequence = "RGB"

# Keep false: the process stays root so buttons, buzzer and the state file
# still work after the matrix initialises.
drop_privileges = false

[clock]
hour_format = 12      # 12 or 24
show_seconds = false
show_date = true
# The colon now stays lit; the seconds bar below shows the minute instead.
blink_colon = false
seconds_bar = true
leading_zero = false

[display]
# Height the clock shrinks to (as a fraction of the panel) once any alarm or
# timer is showing.  0.25 = top quarter.
compact_clock_fraction = 0.25

clock_color = [255, 176, 0]
date_color = [90, 90, 90]
alarm_color = [0, 190, 255]
timer_color = [0, 235, 120]
stopwatch_color = [170, 110, 255]
ringing_color = [255, 40, 40]
expired_color = [110, 110, 110]
heard_color = [200, 120, 255]

fps = 20
ring_flash_hz = 2.0
toast_seconds = 3.0

# 'hms'  -> a three minute timer reads 00:03:00
# 'auto' -> a three minute timer reads 03:00, and hours appear only when used
timer_format = "hms"

# Outline font for the time itself. "" falls back to seven-segment digits.
# `python -m ledclock --compare-fonts out/` renders every candidate.
clock_font = "/usr/share/fonts/opentype/inter/InterDisplay-Black.otf"

# The quarter-height clock has width to spare, so it gets a wider face.
compact_clock_font = "/usr/share/fonts/truetype/dejavu/DejaVuSans-Bold.ttf"
compact_clock_tracking = 0

# Shade edge pixels using the panel's PWM. Smooths curves and diagonals;
# set false for hard on/off pixels.
clock_antialias = true

# The bar under the time, showing seconds left in the minute. It spans the
# width of the digits above it.
seconds_bar_height = 2          # 1px in the compact clock regardless
seconds_bar_gap = 2             # space between digits and bar
seconds_bar_color = [255, 176, 0]
seconds_bar_track_color = [46, 32, 0]
seconds_bar_style = "deplete"   # 'deplete' empties; 'fill' grows

# 60 dots, one per second, split into six groups of ten so you can read the
# count in tens rather than estimating a fraction.
seconds_bar_group_size = 10
seconds_bar_dot_width = 1       # pixels per dot
seconds_bar_dot_gap = 0         # gap between dots inside a group
seconds_bar_group_gap = 2       # gap between the six groups (1 less when compact)

font_dir = "rpi-rgb-led-matrix/fonts"
entry_fonts = ["10x20.bdf", "9x18B.bdf", "7x13B.bdf", "6x10.bdf", "5x7.bdf", "4x6.bdf"]

# The spoken-command echo, which owns the bottom line of the panel.  That line
# is reserved whether or not anything is showing on it, so the layout above
# never moves when a command appears or expires.
small_font = "4x6.bdf"

# The date row under the clock.  Bigger than small_font because it is read
# from across the room, and it costs nothing: the time is limited by the
# panel's width, not its height, so the digits stay the same size either way.
date_font = "6x10.bdf"

[entries]
# How long an alarm or timer stays on screen after it fires, in seconds.
linger_seconds = 300
# How long it flashes and buzzes before going quiet but staying on screen.
ring_seconds = 30
max_visible = 8

[buzzer]
# Flip to true once the piezo is wired.
enabled = true
pin = 12
type = "passive"        # 'passive' = bare piezo (PWM); 'active' = self-driving module

# One number is a single tone.  A list alternates, one tone per beat, which is
# what makes a warble:
#     frequency_hz = 4400              # plain beep
#     frequency_hz = [4400, 3300]      # two-tone
#
# Stay near the element's resonance.  It is a mechanical resonator and the peak
# is sharp — measured on this build, 4400 Hz is 29 dB (about 29x the sound
# pressure) above 2730 Hz, and by 500 Hz there is essentially nothing left:
# +1.2 dB above the empty room.  Low tones like 80/160 Hz will not be audible
# at all; get a "low" character from a slow beat_on instead, not a low tone.
# Anything from 4200-4700 is within a couple of dB.  Re-measure if you swap the
# part:
#     python -m ledclock --buzzer-sweep
frequency_hz = [4400, 3300]

# 50% is the loudest for a piezo; measured 8 dB above a 10% duty cycle.
duty_cycle = 50

# How long each beat holds, and the gap after it.
#
# beat_off = 0 runs the tones straight into each other, so a two-tone list
# becomes a continuous warble — beat_on then sets the warble rate.  Give
# beat_off a value instead and you get separate beeps that alternate pitch.
#
#     beat_on = 0.12, beat_off = 0     European-siren warble  (current)
#     beat_on = 0.15, beat_off = 0.35  urgent alternating beeps
#     beat_on = 0.4,  beat_off = 0.4   slow two-tone doorbell
beat_on = 0.12
beat_off = 0.0
# The module switches its buzzer with an S8550 (SMD code "2TY"), a PNP on the
# high side — so it conducts when the data pin is pulled LOW.  Idling the pin
# high is what actually turns it off between beats.
active_high = false

[buttons]
enabled = true
pull_up = true          # wire the button between the GPIO pin and GND
bounce_seconds = 0.05
hold_seconds = 1.0
brightness_levels = [20, 40, 60, 85, 100]
snooze_minutes = 9

# GPIO (BCM numbering) -> action.
#
# Available actions:
#   dismiss             silence the ringing entry   (hold = silence all)
#   dismiss_all         silence everything
#   snooze              push ringing entries back by snooze_minutes
#   cycle_brightness    step through brightness_levels
#   toggle_hour_format  flip 12h <-> 24h
#   add_minute          +1 minute to the top entry
#   pause_resume        pause/resume the first timer
#   cancel_last         delete the most recently created entry
#
# With parallel = 1 the matrix occupies GPIO 4, 7, 8, 9, 10, 11, 15, 17, 18,
# 22, 23, 24, 25 and 27 — so 5, 6, 12, 13, 14, 16, 19, 20, 21 and 26 are free.
# Raising `parallel` claims 5, 6, 12, 13, 16, 19, 20, 21 and 26 as well.
[buttons.pins]
5 = "dismiss"
6 = "snooze"
13 = "cycle_brightness"
26 = "cancel_last"

[voice]
enabled = true

# Anything you like, one word or several.  Check it before you commit to it —
# a word the speech model has no pronunciation for is dropped without
# complaint and the clock then never wakes at all:
#     python -m ledclock --check-wake "timekeeper"
wake_phrase = "timekeeper"

# Only applies when wake_phrase is one word repeated, e.g. "clock clock
# clock": it says how many of them must actually land, so a mic that clips
# the first one does not cost you the command.  A phrase of distinct words is
# always matched in full, and this is ignored.
#
# A single word wakes on one hit.  If that turns out to trigger by itself,
# make it "timekeeper timekeeper" and leave this at 2.
wake_min_repeats = 2

command_timeout = 8.0
model_path = "models/vosk-model-small-en-us-0.15"

# 'plughw:' (not 'hw:') lets ALSA resample the mic's 48 kHz down to 16 kHz.
# Run `python -m ledclock --list-audio` to see the card numbers.
device = "plughw:CARD=Device,DEV=0"
sample_rate = 16000

# Restrict recognition to the command vocabulary.  Big accuracy win on the
# small model; set false if you want to experiment with free-form phrasing.
use_grammar = true

# Software boost on the captured samples, for when the ALSA capture control is
# already maxed and you still have to lean towards the mic.  1.0 = untouched.
# Measure before changing it — this clips headroom, it cannot create any:
#     python -m ledclock --mic-level
gain = 1.0

[power]
# "clock clock clock, shut down" / "reboot".
enabled = true

# Ask before acting.  The clock puts "shutdown? say yes" on the panel and only
# a spoken "yes" within the window goes through; anything else stands it down.
# This is what makes the feature safe to leave on — turn it off and the first
# thing the mic mishears costs you a walk to the plug.
confirm = true
confirm_seconds = 10.0

# The clock runs as root, so these need no sudo.
shutdown_command = ["systemctl", "poweroff"]
reboot_command = ["systemctl", "reboot"]

[control]
# Local Unix socket that lets you drive the clock without speaking:
#     python -m ledclock --send "set a timer for 3 minutes"
# Local only — nothing listens on the network.
enabled = true
socket = "/run/ledclock.sock"
group = "gpio"

[state]
# Alarms and timers survive a restart.
path = "state.json"
restore_on_start = true
